plugins {
    id 'com.android.application'
}

android {
    namespace 'app.worldaudio'
    compileSdk 34

    defaultConfig {
        applicationId "app.worldaudio"
        minSdk 26
        targetSdk 34
        // The release workflow passes these in; the defaults are for local Android Studio builds.
        versionCode Integer.parseInt((project.findProperty("versionCode") ?: "1").toString())
        versionName (project.findProperty("versionName") ?: "0.6.0").toString()
    }

    signingConfigs {
        release {
            // A hobby signing key kept in the repo so every release can update the previous one.
            // See README.md if you ever want to swap in a private key.
            storeFile file("world-audio.keystore")
            storePassword "worldaudio"
            keyAlias "worldaudio"
            keyPassword "worldaudio"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
// No third-party libraries: the app is plain Android + WebView.
